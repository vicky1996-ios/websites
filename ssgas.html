        <script>
            
            function addRow(){
                
                let row = `
    <tr>
    
        <td>
            <textarea class="editable description-title">New Service</textarea>
            <textarea class="editable description-sub">Service description</textarea>
        </td>
    
        <td>
            <input type="number" class="small-input price" value="0" onchange="calculateTotals()">
        </td>
    
        <td>
            <input type="number" class="small-input qty" value="1" onchange="calculateTotals()">
        </td>
    
        <td class="amount">₹0.00</td>
    
        <td class="action-column">
            <button class="action-btn" onclick="removeRow(this)">X</button>
        </td>
    
    </tr>
    `;
    
    document.getElementById("tableBody").insertAdjacentHTML("beforeend", row);
    
    calculateTotals();
            }
            
            function removeRow(btn){
                
                btn.closest("tr").remove();
                
                calculateTotals();
            }
            
            function calculateTotals(){
                
                let prices = document.querySelectorAll(".price");
                let qtys = document.querySelectorAll(".qty");
                let amounts = document.querySelectorAll(".amount");
                
                let subtotal = 0;
                
                for(let i=0;i<prices.length;i++){
                    
                    let price = parseFloat(prices[i].value) || 0;
                    let qty = parseFloat(qtys[i].value) || 0;
                    
                    let total = price * qty;
                    
                    subtotal += total;
                    
                    amounts[i].innerHTML = "₹" + total.toFixed(2);
                }
                
                let discount = parseFloat(document.getElementById("discount").value) || 0;
                
                let taxRate = parseFloat(document.getElementById("taxRate").value) || 0;
                
                let taxable = subtotal - discount;
                
                let tax = taxable * taxRate / 100;
                
                let final = taxable + tax;
                
                document.getElementById("subtotal").innerHTML = "₹" + subtotal.toFixed(2);
                
                document.getElementById("taxAmount").innerHTML = "₹" + tax.toFixed(2);
                
                document.getElementById("finalTotal").innerHTML = "₹" + final.toFixed(2);
                
                document.getElementById("grandTotal").innerHTML = "₹" + final.toFixed(2);
            }
            
            function downloadHTML(){
                
                const html = document.documentElement.outerHTML;
                
                const blob = new Blob([html], {type:'text/html'});
                
                const link = document.createElement('a');
                
                link.href = URL.createObjectURL(blob);
                
                link.download = 'invoice-template.html';
                
                link.click();
            }
            
            calculateTotals();
            
        </script>
